<div class="signup-container">
    <div class="row justify-content-center">
        <div class="col md-6 col-lg-4">
            <div class="card mt-5">
                <div class="card-header bg-primary bg-opacity-75">
                    <h3 class="card-title mb-0 text-white">Sign Up</h3>
                </div>
                <div class="card-body">
                        <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
                            {{ errorMessage }}
                        </div>
                    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="text" class="form-control" id="email" [ngClass]="{'is-invalid': hasError('email', 'required') || hasError('email', 'email')}" formControlName="email" required>
                             <div class="invalid-feedback" *ngIf="hasError('email', 'required')">
                            Email is required.
                            </div>
                            <div class="invalid-feedback" *ngIf="hasError('email', 'email')">
                                Please enter a valid email address.
                            </div>
                        </div>
                       
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                          <!--The [ngClass] directive is used to dynamically add or remove CSS classes based on the evaluation of an expression. In this case, it adds the 'is-invalid' class if the password field has a 'required' or 'minlength' error. -->
                            <input type="password" class="form-control" id="password" [ngClass]="{'is-invalid': hasError('password', 'required') || hasError('password', 'minlength')}" formControlName="password" required>
                            <div class="invalid-feedback" *ngIf="hasError('password', 'required')">
                            Password is required.
                            </div>
                            <div class="invalid-feedback" *ngIf="hasError('password', 'minlength')">
                                Password must be at least 6 characters long.
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="confirmPassword" [ngClass]="{'is-invalid': hasError('confirmPassword', 'required') || (signupForm.hasError('passwordMismatch') && signupForm.get('confirmPassword')?.touched)}" formControlName="confirmPassword" required>
                            <div class="invalid-feedback" *ngIf="hasError('confirmPassword', 'required')">
                            Confirm Password is required.
                            </div>
                            <div class="invalid-feedback" *ngIf="signupForm.hasError('passwordMismatch') && signupForm.get('confirmPassword')?.touched">
                                Passwords must match.
                            </div>
                        </div>
                        

                        <div class="d-grid">
                            <p>Already have an account? <a routerLink="/login">Login here</a></p>
                            <button type="submit" class="btn btn-primary" [disabled]="!signupForm.valid">Sign Up</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
